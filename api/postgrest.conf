# PostgREST konfigürasyonu
# Bu dosya env variable'lar tarafından override edilir (docker-compose.yml'de)
db-uri = "postgres://seyyare:change_me_in_production@postgres:5432/seyyare"
db-anon-role = "anon"
db-authenticator-role = "authenticator"
db-pre-request = "public.pre_request"

jwt-secret = "please_generate_a_strong_secret_at_least_32_chars_long"
jwt-exp = 3600

server-port = 3000
server-host = "0.0.0.0"

# Schema config
db-schemas = "public,storage"
db-extra-search-path = "public,extensions"

# OpenAPI devre dışı (production'da gerekirse etkinleştir)
openapi-mode = "disabled"

# Transaction mode: COMMIT-allow-override POST/PATCH için gerekli
db-tx-end = "commit-allow-override"

# Row-Level Security
db-channel-enabled = false

# Logging
log-level = "info"