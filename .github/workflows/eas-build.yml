name: EAS Build & Submit

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      profile:
        description: "EAS Build profile"
        required: true
        type: choice
        options:
          - development
          - preview
          - production

jobs:
  build-android:
    name: Build Android (APK/AAB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile
        run: pnpm install --no-frozen-lockfile

      - name: EAS Build (Android)
        working-directory: apps/mobile
        run: eas build --platform android --non-interactive --no-wait --profile ${{ github.event.inputs.profile || 'preview' }}

  build-ios:
    name: Build iOS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: apps/mobile
        run: pnpm install --no-frozen-lockfile

      - name: EAS Build (iOS)
        working-directory: apps/mobile
        run: eas build --platform ios --non-interactive --no-wait --profile ${{ github.event.inputs.profile || 'preview' }}