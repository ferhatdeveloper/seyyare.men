version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: seyyare-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/00_init.sql:ro
      - ./api/db/migrations:/docker-entrypoint-initdb.d/migrations:ro
      - ./api/db/functions:/docker-entrypoint-initdb.d/functions:ro
      - ./api/db/policies:/docker-entrypoint-initdb.d/policies:ro
      - ./infra/postgres/seed.sql:/docker-entrypoint-initdb.d/99_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seyyare-net

  postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: seyyare-postgrest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: ${PGRST_DB_URI}
      PGRST_DB_ANON_ROLE: ${PGRST_DB_ANON_ROLE}
      PGRST_DB_AUTHENTICATOR_ROLE: ${PGRST_DB_AUTHENTICATOR_ROLE}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_JWT_EXP: ${PGRST_JWT_EXP}
      PGRST_SERVER_PORT: 3000
      PGRST_OPENAPI_MODE: disabled
      PGRST_DB_TX_END: commit-allow-override
      PGRST_DB_PRE_REQUEST: public.pre_request
      PGRST_ADMIN_ENABLED: "false"
    ports:
      - "${POSTGREST_PORT}:3000"
    networks:
      - seyyare-net

  redis:
    image: redis:7.4-alpine
    container_name: seyyare-redis
    restart: unless-stopped
    command: >
      sh -c "redis-server --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}"
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - seyyare-net

  minio:
    image: minio/minio:latest
    container_name: seyyare-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - seyyare-net

  auth-service:
    build:
      context: ./apps/api-auth
      dockerfile: Dockerfile
    container_name: seyyare-auth
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${AUTH_SERVICE_PORT}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379${REDIS_PASSWORD:+:${REDIS_PASSWORD}}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL}
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
    ports:
      - "${AUTH_SERVICE_PORT}:${AUTH_SERVICE_PORT}"
    networks:
      - seyyare-net

  ai-service:
    build:
      context: ./apps/ai-service
      dockerfile: Dockerfile
    container_name: seyyare-ai
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: ${AI_SERVICE_PORT}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      REDIS_URL: redis://redis:6379${REDIS_PASSWORD:+:${REDIS_PASSWORD}}
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MINIO_URL: http://minio:9000
      MINIO_USER: ${MINIO_ROOT_USER}
      MINIO_PASS: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${AI_SERVICE_PORT}:${AI_SERVICE_PORT}"
    networks:
      - seyyare-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: seyyare-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@seyyare.men
      PGADMIN_DEFAULT_PASSWORD: change_me_in_production
      PGADMIN_LISTEN_PORT: 5050
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - seyyare-net

  nginx:
    image: nginx:1.27-alpine
    container_name: seyyare-nginx
    restart: unless-stopped
    depends_on:
      - postgrest
      - auth-service
      - ai-service
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    networks:
      - seyyare-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  seyyare-net:
    driver: bridge