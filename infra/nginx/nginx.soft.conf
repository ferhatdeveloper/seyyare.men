# Soft-launch / LAN+tunnel: HTTP only (no TLS on nginx; Cloudflare Tunnel terminates TLS)
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    proxy_cache_path /var/cache/nginx/media
                     levels=1:2
                     keys_zone=media_cache:10m
                     max_size=1g
                     inactive=7d
                     use_temp_path=off;

    upstream postgrest { server postgrest:3000; }
    upstream auth_service { server auth-service:5000; }
    upstream ai_service { server ai-service:4000; }
    upstream orchestrator { server orchestrator:4050; }
    upstream minio { server minio:9000; }
    upstream web { server web:80; }

    server {
        listen 80;
        server_name _;

        # CORS — Expo / tunnel / cihazlar
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, PUT, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Prefer, Range, X-PSP-Webhook-Secret" always;
        add_header Access-Control-Expose-Headers "Content-Range, Prefer" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /api/ {
            proxy_pass http://postgrest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_read_timeout 60s;
        }

        location /rpc/ {
            proxy_pass http://postgrest/rpc/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }

        location /auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /ai/ {
            proxy_pass http://ai_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 100M;
            proxy_read_timeout 120s;
        }

        location /agents/ {
            proxy_pass http://orchestrator/agents/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_buffering off;
            proxy_cache off;
            client_max_body_size 100M;
            proxy_read_timeout 600s;
        }

        location /orch/ {
            proxy_pass http://orchestrator/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_read_timeout 120s;
        }

        location /storage/ {
            proxy_pass http://minio/;
            proxy_set_header Host $host;
            proxy_buffering on;
            proxy_cache media_cache;
            proxy_cache_valid 200 301 7d;
            proxy_cache_valid 404 1m;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_cache_lock on;
            proxy_ignore_headers Set-Cookie Cache-Control Expires;
            add_header X-Cache-Status $upstream_cache_status always;
            add_header Cache-Control "public, max-age=604800, immutable" always;
            add_header Access-Control-Allow-Origin * always;
        }

        # Marketing site (Vite static)
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
