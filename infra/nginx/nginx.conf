user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 50M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;

    upstream postgrest { server postgrest:3000; }
    upstream auth_service { server auth-service:5000; }
    upstream ai_service { server ai-service:4000; }
    upstream minio { server minio:9000; }

    # HTTP → HTTPS yönlendirme (production)
    server {
        listen 80;
        server_name _;
        location /.well-known/acme-challenge/ { root /var/www/certbot; }
        location /healthz { return 200 "ok"; add_header Content-Type text/plain; }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl http2;
        server_name _;

        ssl_certificate /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # PostgREST ana API
        location /api/ {
            proxy_pass http://postgrest/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
            proxy_read_timeout 60s;
        }

        # RPC fonksiyonları (PostgREST /rpc/)
        location /rpc/ {
            proxy_pass http://postgrest/rpc/;
            proxy_set_header Host $host;
            proxy_set_header Authorization $http_authorization;
            proxy_pass_header Authorization;
        }

        # Auth servisi
        location /auth/ {
            proxy_pass http://auth_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # AI servisi
        location /ai/ {
            proxy_pass http://ai_service/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            client_max_body_size 100M;
            proxy_read_timeout 120s;
        }

        # MinIO (görsel/video)
        location /storage/ {
            proxy_pass http://minio/;
            proxy_set_header Host $host;
            proxy_buffering off;
            proxy_cache off;
        }

        # Health
        location /healthz { return 200 "ok"; add_header Content-Type text/plain; }

        # CORS (development için)
        add_header Access-Control-Allow-Origin * always;
        add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, Prefer, Range" always;

        if ($request_method = OPTIONS) {
            return 204;
        }
    }
}